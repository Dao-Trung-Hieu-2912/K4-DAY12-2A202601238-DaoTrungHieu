<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat Interface</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --glass-bg: rgba(30, 41, 59, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --user-msg: #3b82f6;
            --bot-msg: rgba(51, 65, 85, 0.8);
            --error-color: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(139, 92, 246, 0.15) 0px, transparent 50%);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 800px;
            height: 90vh;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }

        .header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .header-title {
            font-size: 1.25rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #22c55e;
            border-radius: 50%;
            box-shadow: 0 0 8px #22c55e;
        }

        .config-bar {
            display: flex;
            gap: 12px;
        }

        .config-input {
            flex: 1;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            padding: 10px 16px;
            border-radius: 12px;
            font-size: 0.9rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .config-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
        }

        .chat-area {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .chat-area::-webkit-scrollbar {
            width: 6px;
        }
        .chat-area::-webkit-scrollbar-track {
            background: transparent;
        }
        .chat-area::-webkit-scrollbar-thumb {
            background: var(--glass-border);
            border-radius: 10px;
        }

        .message-wrapper {
            display: flex;
            flex-direction: column;
            max-width: 85%;
            animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .message-wrapper.user {
            align-self: flex-end;
            align-items: flex-end;
        }

        .message-wrapper.bot {
            align-self: flex-start;
            align-items: flex-start;
        }

        .message-bubble {
            padding: 14px 18px;
            border-radius: 18px;
            font-size: 0.95rem;
            line-height: 1.5;
            position: relative;
        }

        .user .message-bubble {
            background: var(--user-msg);
            border-bottom-right-radius: 4px;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }

        .bot .message-bubble {
            background: var(--bot-msg);
            border: 1px solid var(--glass-border);
            border-bottom-left-radius: 4px;
        }
        
        .error .message-bubble {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid var(--error-color);
            color: #fca5a5;
        }

        .meta-info {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 6px;
            display: flex;
            gap: 12px;
        }

        .input-area {
            padding: 20px 24px;
            border-top: 1px solid var(--glass-border);
            background: rgba(15, 23, 42, 0.3);
        }

        .input-form {
            display: flex;
            gap: 12px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--glass-border);
            padding: 8px;
            border-radius: 20px;
            transition: all 0.3s ease;
        }
        
        .input-form:focus-within {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
        }

        .message-input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-main);
            padding: 10px 16px;
            font-size: 0.95rem;
            outline: none;
        }

        .message-input::placeholder {
            color: var(--text-muted);
        }

        .send-btn {
            background: var(--primary);
            color: white;
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .send-btn:hover {
            background: var(--primary-hover);
            transform: scale(1.05);
        }

        .send-btn:disabled {
            background: var(--glass-border);
            cursor: not-allowed;
            transform: none;
        }

        .typing-indicator {
            display: none;
            padding: 14px 18px;
            background: var(--bot-msg);
            border: 1px solid var(--glass-border);
            border-radius: 18px;
            border-bottom-left-radius: 4px;
            align-self: flex-start;
            margin-bottom: 20px;
        }

        .typing-indicator span {
            display: inline-block;
            width: 6px;
            height: 6px;
            background: var(--text-muted);
            border-radius: 50%;
            margin: 0 2px;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
        .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div class="header-title">
                <div class="status-dot"></div>
                Giao Diện Chat Trực Tuyến
            </div>
            <div class="config-bar">
                <input type="text" id="apiUrl" class="config-input" placeholder="API URL" value="https://k4-day12-2a202601238-daotrunghieu.onrender.com/chat">
                <input type="password" id="apiToken" class="config-input" placeholder="API Token (Bắt buộc)">
                <input type="text" id="clientId" class="config-input" placeholder="Client ID" value="sv-test">
            </div>
        </div>

        <div class="chat-area" id="chatArea">
            <div class="message-wrapper bot">
                <div class="message-bubble">
                    Xin chào! Tôi là hệ thống Chatbot do bạn triển khai. Hãy điền API Token ở ô phía trên và bắt đầu trò chuyện nhé!
                </div>
            </div>
            <div class="typing-indicator" id="typingIndicator">
                <span></span><span></span><span></span>
            </div>
        </div>

        <div class="input-area">
            <form class="input-form" id="chatForm">
                <input type="text" class="message-input" id="messageInput" placeholder="Nhập tin nhắn của bạn..." autocomplete="off">
                <button type="submit" class="send-btn" id="sendBtn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                </button>
            </form>
        </div>
    </div>

    <script>
        const chatForm = document.getElementById('chatForm');
        const messageInput = document.getElementById('messageInput');
        const chatArea = document.getElementById('chatArea');
        const typingIndicator = document.getElementById('typingIndicator');
        const apiUrlInput = document.getElementById('apiUrl');
        const apiTokenInput = document.getElementById('apiToken');
        const clientIdInput = document.getElementById('clientId');
        const sendBtn = document.getElementById('sendBtn');

        function appendMessage(sender, text, meta = null, isError = false) {
            const wrapper = document.createElement('div');
            wrapper.className = `message-wrapper ${sender} ${isError ? 'error' : ''}`;
            
            const bubble = document.createElement('div');
            bubble.className = 'message-bubble';
            bubble.textContent = text;
            wrapper.appendChild(bubble);

            if (meta) {
                const metaDiv = document.createElement('div');
                metaDiv.className = 'meta-info';
                metaDiv.innerHTML = `<span>💰 ${meta.cost} USD</span><span>⚡ ${meta.tokens} tokens</span>`;
                wrapper.appendChild(metaDiv);
            }

            chatArea.insertBefore(wrapper, typingIndicator);
            scrollToBottom();
        }

        function scrollToBottom() {
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const message = messageInput.value.trim();
            const token = apiTokenInput.value.trim();
            const url = apiUrlInput.value.trim();
            const clientId = clientIdInput.value.trim();

            if (!message) return;
            if (!token) {
                alert('Vui lòng nhập API Token trước khi gửi!');
                apiTokenInput.focus();
                return;
            }

            // Giao diện: Hiển thị tin nhắn user
            appendMessage('user', message);
            messageInput.value = '';
            
            // Hiện typing & vô hiệu hoá nút
            typingIndicator.style.display = 'block';
            scrollToBottom();
            sendBtn.disabled = true;
            messageInput.disabled = true;

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`,
                        'X-Client-Id': clientId
                    },
                    body: JSON.stringify({ message: message })
                });

                const data = await response.json();

                if (response.ok) {
                    appendMessage('bot', data.reply, {
                        cost: data.usd_cost.toFixed(6),
                        tokens: (data.usage.prompt + data.usage.completion)
                    });
                } else {
                    let errMsg = 'Có lỗi xảy ra.';
                    if (response.status === 401) errMsg = 'Lỗi 401: Sai hoặc thiếu API Token!';
                    if (response.status === 429) errMsg = 'Lỗi 429: Rate limit! Gửi quá nhanh.';
                    if (response.status === 402) errMsg = 'Lỗi 402: Hết ngân sách ngày!';
                    appendMessage('bot', errMsg + ' (Chi tiết: ' + JSON.stringify(data) + ')', null, true);
                }
            } catch (error) {
                appendMessage('bot', 'Lỗi mạng (Network Error). Hãy chắc chắn server đang chạy, URL đúng và có cấu hình CORS.', null, true);
            } finally {
                // Ẩn typing & mở lại nút
                typingIndicator.style.display = 'none';
                sendBtn.disabled = false;
                messageInput.disabled = false;
                messageInput.focus();
            }
        });
    </script>
</body>
</html>
